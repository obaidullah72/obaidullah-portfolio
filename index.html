    <style>
      /* Brief splash shown until React mounts; removed by LoadingScreen.jsx */
      #splash {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: grid;
        place-items: center;
        background: #070b16;
        transition: opacity 0.45s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 88px;
        height: 88px;
        border-radius: 9999px;
        object-fit: cover;
        background: #101b30;
        border: 2px solid rgb(59 130 246 / 0.55);
        animation: splash-pulse 1.2s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        50% {
          box-shadow: 0 0 0 12px rgb(59 130 246 / 0.1);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash img {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true"><img src="/favicon.png" alt="" width="88" height="88" /></div>
